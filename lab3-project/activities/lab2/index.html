<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Connect | Halifax Campus Event Finder</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <a class="skip-link" href="#searchInput">Skip to search</a>

    <header class="site-header">
        <div class="container header-row">
            <div class="brand">
                <svg class="logo" viewBox="0 0 48 48" role="img" aria-label="Campus Connect lighthouse logo">
                    <path d="M20 42h8l-1.5-22h-5z" fill="currentColor"/>
                    <path d="M18 20h12l-2-6h-8z" fill="currentColor"/>
                    <circle cx="24" cy="10" r="3.5" fill="var(--accent)"/>
                    <path d="M4 44c6-3 10 3 16 0s10 3 16 0 6 1 8 0" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"/>
                </svg>
                <div>
                    <h1>Campus Connect</h1>
                    <p class="tagline">Find what's happening on campus, from Halifax to your calendar.</p>
                </div>
            </div>
            <button type="button" id="themeBtn" aria-pressed="false">Light theme</button>
        </div>
    </header>

    <main class="container">
        <section class="next-up" aria-labelledby="nextHeading">
            <h2 id="nextHeading">Next up</h2>
            <p id="nextEvent">Loading events…</p>
        </section>

        <section class="search-section" aria-label="Search and filters">
            <form id="searchForm" role="search">
                <label for="searchInput">Search events by title, society, place, category or date</label>
                <div class="search-controls">
                    <input type="search" id="searchInput" placeholder="Try: gala, Goldberg, career, Nov" autocomplete="off" aria-describedby="searchHelp">
                    <button type="button" id="clearBtn" aria-label="Clear search input">Clear</button>
                    <button type="button" id="surpriseBtn">Surprise me</button>
                </div>
                <p id="searchHelp" class="hint">Results update as you type. Press / to jump to search.</p>

                <div class="filters">
                    <fieldset id="orgFilters">
                        <legend>Filter by organization</legend>
                    </fieldset>
                    <div class="select-group">
                        <label for="sortSelect">Sort by</label>
                        <select id="sortSelect">
                            <option value="date-asc">Date: soonest first</option>
                            <option value="date-desc">Date: latest first</option>
                            <option value="title">Title: A to Z</option>
                        </select>
                        <label class="check"><input type="checkbox" id="upcomingOnly"> Upcoming only</label>
                        <label class="check"><input type="checkbox" id="savedOnly"> Saved only</label>
                    </div>
                </div>
            </form>
        </section>

        <p id="resultCount" class="result-count"></p>
        <div id="liveAnnouncer" class="sr-only" aria-live="polite" aria-atomic="true"></div>

        <section id="resultsSection" aria-label="Search results">
            <div id="resultsGrid" class="grid"></div>
            <div id="emptyState" class="empty hidden" role="status"></div>
        </section>
    </main>

    <footer class="container site-footer">
        <p>Campus Connect, CSCI 3172 Lab 2. Data scraped from a sample event directory.</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
